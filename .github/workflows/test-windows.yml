
name: Windows Tests

on:
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: windows-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Set up Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Start web server
        run: |
          Start-Process -FilePath python -ArgumentList "-m","http.server","8000" -WindowStyle Hidden
          $up = $false
          for ($i = 0; $i -lt 15; $i++) {
            try {
              Invoke-WebRequest -Uri "http://localhost:8000/index.html" -UseBasicParsing | Out-Null
              $up = $true; break
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { Write-Error "Server did not start"; exit 1 }
          Write-Host "Server is up"

      - name: Run Selenium tests
        env:
          APP_URL: http://localhost:8000/index.html
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          HEADLESS: "1"
        run: python run_tests.py

      - name: Generate test report
        if: always()
        env:
          REPORT_PLATFORM: Windows
        run: python generate_report.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-windows
          path: test_report.html
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
